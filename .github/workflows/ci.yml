name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Tip kontrolü ve derleme.
  #
  # Veritabanı BAĞLANTISI YOK ve olmamalı: lib/db.ts bağlantıyı tembel
  # kuruyor, sayfalar veri çekemediğinde boş durumla üretiliyor.
  # Bu iş, o toleransın bozulmadığını da doğrular — env'siz build
  # kırılırsa önizleme dağıtımları da kırılır.
  # ─────────────────────────────────────────────────────────────
  kalite:
    name: Tip kontrolü ve derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Derleme
        run: npx next build --no-lint

  # ─────────────────────────────────────────────────────────────
  # Şema doğrulaması.
  #
  # Migration'lar ve seed gerçek bir PostGIS örneğine karşı çalıştırılır.
  # pg_cron bu imajda yok; migration'lar koşullu olduğu için atlanır ve
  # kırılmaz — aynı SQL hem Supabase'de hem burada çalışır.
  # ─────────────────────────────────────────────────────────────
  sema:
    name: Şema ve seed
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: konutprojeleri
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DIRECT_URL: postgres://postgres:test@localhost:5432/konutprojeleri
      DATABASE_URL: postgres://postgres:test@localhost:5432/konutprojeleri

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Göçleri çalıştır
        run: node scripts/migrate.mjs

      - name: Seed
        run: node scripts/seed.mjs

      - name: Doğrulama sorguları
        run: node scripts/dogrula.mjs

      # ─────────────────────────────────────────────────────────
      # Veriyle derleme — bugünün dersi.
      #
      # dogrula.mjs kendi SQL'ini çalıştırır, uygulamanınkini değil.
      # Bu yüzden üç gerçek hata Supabase'e bağlanana kadar görünmedi:
      # arama sorgusunda eksik takma ad, numeric sütunların metin
      # dönmesi ve dizi filtrelerinin düz değere ayarlanması. Üçü de
      # ancak SAYFA RENDER EDİLİNCE patlıyordu.
      #
      # Burada gerçek şema + seed verisiyle üretim derlemesi yapılır;
      # statik üretim tüm sayfaları render ettiği için aynı sınıftan
      # bir hata bir daha canlıya kadar gidemez.
      # ─────────────────────────────────────────────────────────
      - name: Veriyle derleme (sayfaları render eder)
        run: npx next build --no-lint
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
