<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KonutProjeleri">
  <!--
    Favicon: MAVİ ZEMİNDE BEYAZ K.
    Harf, 16 pikselde tanınan tek biçim; soyut bir çizim o boyutta
    okunmuyor. Marka adının baş harfi.
    Renkler `globals.css` içindeki --primary (#3A45E0) ve
    --primary-600 (#2730A8) ile aynı.
  -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A45E0"/>
      <stop offset="1" stop-color="#2730A8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#vg)"/>
  <!-- K: dikey gövde + iki kol; 16 pikselde kollar birleşmiyor -->
  <path d="M20 16 L20 48 M20 32 L40 16 M20 32 L41 48" fill="none" stroke="#FFFFFF"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Logodaki altın nokta: marka işaretini simgeye de taşıyor -->
  <circle cx="47" cy="45" r="4.6" fill="#EFA013"/>
</svg>
